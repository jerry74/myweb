<!doctype html>
<html lang="zh-Hant" data-style="{{STYLE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta name="description" content="{{SUMMARY}}">
  <title>{{TRIP_NAME}}</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-ui="trip-wayfinder">
  <a class="skip-link" href="#mainContent">跳到主要內容</a>

  <header class="topbar">
    <a class="brand" href="../" aria-label="回到 TripHelper 首頁">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.75 15.2 8.8l6.05 3.2-6.05 3.2L12 21.25 8.8 15.2 2.75 12 8.8 8.8 12 2.75Z"/>
        <circle cx="12" cy="12" r="2.25"/>
      </svg>
      <span>
        <strong id="brandShortName">{{SHORT_NAME}}</strong>
        <small>TripHelper</small>
      </span>
    </a>

    <div class="topbar-actions">
      <button class="icon-button" id="themeButton" type="button" aria-label="切換深色模式" title="切換顯示模式">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"/>
        </svg>
      </button>
      <button class="install-button" id="installButton" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        安裝
      </button>
    </div>
  </header>

  <main id="mainContent">
    <section class="hero" aria-labelledby="tripName">
      <div class="hero-copy">
        <div class="eyebrow-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="tripStatus">行程準備中</span>
          <span class="eyebrow-separator" aria-hidden="true"></span>
          <span id="tripDateRange">{{DATE_RANGE}}</span>
        </div>
        <h1 id="tripName">{{TRIP_NAME}}</h1>
        <p class="hero-summary" id="tripSummary">{{SUMMARY}}</p>

        <div class="countdown" id="countdown" hidden aria-live="polite">
          <span>距離出發</span>
          <strong id="countdownValue">—</strong>
        </div>
      </div>

      <aside class="next-stop" id="nextStopCard" aria-labelledby="nextStopLabel">
        <div class="next-stop-kicker">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
          <span id="nextStopLabel">下一站</span>
        </div>
        <p class="next-stop-time" id="nextStopTime">查看今日安排</p>
        <h2 id="nextStopTitle">選擇日期開始瀏覽</h2>
        <a class="route-link" id="nextStopLink" href="#timelineSection" hidden>
          開啟導航
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
      </aside>
    </section>

    <nav class="day-rail" aria-label="選擇行程日期">
      <div class="day-rail-track" id="dayRail"></div>
    </nav>

    <section class="day-view" aria-labelledby="dayTitle">
      <header class="day-heading">
        <div>
          <p class="day-number" id="dayNumber">DAY 01</p>
          <h2 id="dayTitle">載入行程中</h2>
        </div>
        <p class="day-stay-inline" id="dayStayInline"></p>
      </header>

      <div class="day-layout">
        <section class="timeline-section" id="timelineSection" aria-labelledby="timelineTitle">
          <h3 class="section-label" id="timelineTitle">時間線</h3>
          <ol class="timeline" id="timeline"></ol>
        </section>

        <aside class="briefing" aria-label="當日摘要">
          <section class="brief-block">
            <div class="brief-heading">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg>
              <h3>住宿</h3>
            </div>
            <div id="stayDetails"></div>
          </section>

          <section class="brief-block">
            <div class="brief-heading">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8m3-8v8M7 7h3m7-4v18m0-18c-2 2-2 7 0 9"/></svg>
              <h3>三餐</h3>
            </div>
            <div class="meal-list" id="mealList"></div>
          </section>

          <section class="brief-block weather-block">
            <div class="brief-heading">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 10a3 3 0 0 1 0 6H7Zm2 3-1 2m5-2-1 2m5-2-1 2"/></svg>
              <h3>雨天備案</h3>
            </div>
            <p id="rainPlan"></p>
          </section>

          <section class="brief-block shopping-block" id="shoppingBlock" hidden>
            <div class="brief-heading">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Zm3 0a3 3 0 0 1 6 0"/></svg>
              <h3>購物備案</h3>
            </div>
            <div class="shopping-list" id="shoppingList"></div>
          </section>
        </aside>
      </div>
    </section>

    <div class="update-prompt" id="appUpdatePrompt" hidden role="status">
      <div>
        <strong>有新版行程可用</strong>
        <span>更新後即可取得最新內容。</span>
      </div>
      <button id="appUpdateButton" type="button">立即更新</button>
    </div>
  </main>

  <footer class="footer">
    <span>離線可用</span>
    <span aria-hidden="true">·</span>
    <span>資料版本 {{BUILD_DATE}}</span>
  </footer>

  <script src="./data.fallback.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
